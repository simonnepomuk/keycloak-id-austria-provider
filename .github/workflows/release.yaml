name: Release

on:
  workflow_run:
    workflows: [Build]
    branches: [main]
    types: [completed]

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Publish
    runs-on: ubuntu-latest
    steps:
    - name: Git checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Publish
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: ./gradlew nyxPublish --stacktrace